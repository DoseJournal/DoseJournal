workflows:
  ionic-capacitor-ios:
    name: MedLedger iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.amyjuliet.medledger
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6796246208
      node: v20.19.0
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web assets
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          xcode-build-incremental \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -config Release \
            -archivePath /tmp/xcodebuild/MedLedger.xcarchive \
            OTHER_CODE_SIGN_FLAGS="--keychain /Users/builder/Library/Keychains/ios-build.keychain" \
            CODE_SIGN_STYLE=Manual
    artifacts:
      - /tmp/xcodebuild/*.xcarchive
      - "**/*.ipa"
      - /tmp/xcodebuild/*.dsym
