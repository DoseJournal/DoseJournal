workflows:
  ionic-capacitor-ios:
    name: MedLedger iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.amyjuliet.medledger
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6796246208
      node: v20.19.0
    scripts:
      - name: Install dependencies
        script: |
          npm install --force
          npm install @capacitor/core @capacitor/ios @capacitor/cli --force
      - name: Build web assets
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          mkdir -p /tmp/xcodebuild
          cp ExportOptions.plist /tmp/ExportOptions.plist
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath /tmp/xcodebuild/MedLedger.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            | xcpretty
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/xcodebuild/MedLedger.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath /tmp/xcodebuild/ipa \
            | xcpretty
    artifacts:
      - /tmp/xcodebuild/*.xcarchive
      - /tmp/xcodebuild/ipa/*.ipa
      - /tmp/xcodebuild/*.dsym
