workflows:
  ionic-capacitor-ios:
    name: DoseJournal iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.amyjuliet.dosejournal
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6796551533
      node: v20.19.0
    scripts:
      - name: Install dependencies
        script: |
          npm install --force
          npm install @capacitor/core@6 @capacitor/ios@6 @capacitor/cli@6 --force
      - name: Build web assets
        script: npm run build
      - name: Add iOS platform
        script: |
          rm -rf ios
          npx cap add ios
          perl -i -pe "s/platform :ios, '[0-9.]+'/platform :ios, '13.0'/" ios/App/Podfile
      - name: Generate app icon
        script: |
          npm install @capacitor/assets --save-dev --force
          npx capacitor-assets generate --ios
      - name: Install CocoaPods
        script: cd ios/App && pod install --repo-update
      - name: Sync web assets
        script: npx cap copy ios
      - name: Set build number
        script: |
          echo "Setting build number to $BUILD_NUMBER"
          perl -i -pe "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
          grep CURRENT_PROJECT_VERSION ios/App/App.xcodeproj/project.pbxproj
      - name: Restrict to iPhone only
        script: |
          perl -i -pe 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = 1/g' ios/App/App.xcodeproj/project.pbxproj
          grep TARGETED_DEVICE_FAMILY ios/App/App.xcodeproj/project.pbxproj
      - name: Set up code signing
        script: |
          xcode-project use-profiles
          echo "--- Installed profiles ---"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ || true
      - name: Build iOS
        script: |
          mkdir -p /tmp/xcodebuild
          cp ExportOptions.plist /tmp/ExportOptions.plist
          PROFILE_UUID=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1 | xargs -I{} security cms -D -i {} 2>/dev/null | grep -A1 UUID | grep string | sed 's/.*<string>\(.*\)<\/string>/\1/' || echo "")
          echo "Profile UUID: $PROFILE_UUID"
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath /tmp/xcodebuild/DoseJournal.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            ${PROFILE_UUID:+PROVISIONING_PROFILE="$PROFILE_UUID"} 2>&1 | tail -50
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/xcodebuild/DoseJournal.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath /tmp/xcodebuild/ipa
    artifacts:
      - /tmp/xcodebuild/*.xcarchive
      - /tmp/xcodebuild/ipa/*.ipa
      - /tmp/xcodebuild/*.dsym
